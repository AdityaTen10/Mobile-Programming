<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script> 
$(document).ready(function(){
  $("button").click(function(){
    $("#inside").animate({ top: '300px' }, 1000);   
    $("#inside").animate({ left: '300px' }, 1000);
    $("#inside").animate({ top: '0px'}, 1000); 
    $("#inside").animate({ left: '0px'}, 1000);
    $("#inside").animate({ top: '300px'}, 1000); 
  });
});
</script> 
</head>
<body>

<button>Start Animation</button>

<p>By default, all HTML elements have a static position, and cannot be moved. To manipulate the position, remember to first set the CSS position property of the element to relative, fixed, or absolute!</p>
<div id="outside" style="background:#98bf21;height:400px;width:400px; position:relative;">
    <div id="inside" style="background:black;height:100px;width:100px;position:absolute;"></div>
</div>


</body>
</html>
